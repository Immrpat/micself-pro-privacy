<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicSelf Pro — microphone foreground service</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    video { width: 100%; max-width: 360px; background: #000; border-radius: 16px; }
  </style>
</head>
<body>
  <h1>MicSelf Pro microphone foreground service</h1>
  <p>
    The user taps Start monitoring. MicSelf Pro keeps the microphone active after
    they leave the app. Android shows the ongoing notification “MicSelf Pro is
    listening,” with a Stop action, and the microphone indicator stays in the
    status bar.
  </p>
  <video controls playsinline src="microphone-foreground-service.mp4"></video>
</body>
